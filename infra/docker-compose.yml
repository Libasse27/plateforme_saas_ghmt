# Environnement de DÉVELOPPEMENT uniquement : ports liés à 127.0.0.1, mots de passe surchargeables via infra/.env.
# Images épinglées par digest (docs/11 §6.5) : le tag lisible est conservé pour la relecture, seul le digest fait foi.
# Mise à jour : `docker buildx imagetools inspect <image>:<tag>` puis remplacer le digest ; contrôle : infra/deploy/check-pinned-images.sh.
# Stockage objet : SeaweedFS (S3, verrouillage d'objet), retenu à l'essai de la phase 0 de docs/13 (MinIO retiré, Garage sans versions d'objet).
# Avant tout environnement partagé : fournir les secrets via un coffre.
name: ghmt
services:
  postgres:
    # postgres:17.11-alpine
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ghmt_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghmt_dev_only}
      POSTGRES_DB: ghmt
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghmt_owner -d ghmt"]
      interval: 5s
      retries: 10
  redis:
    # redis:7.4.11-alpine
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports: ["127.0.0.1:6379:6379"]
  mailpit:
    # axllent/mailpit:v1.31.4
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  s3:
    # chrislusf/seaweedfs:4.48 (S3 seul, données persistées ; identifiants de développement dans `configs`)
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - s3data:/data
  clamav:
    # clamav/clamav:1.5.4 (clamd sur 3310 ; signatures mises à jour par freshclam au démarrage, ~1,5 Go de mémoire)
    image: clamav/clamav:1.5.4@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    ports: ["127.0.0.1:3310:3310"]
    volumes:
      - clamdb:/var/lib/clamav
configs:
  s3_identities:
    content: |
      {"identities":[{"name":"ghmt-dev","credentials":[{"accessKey":"ghmt-dev","secretKey":"ghmt-dev-s3-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
volumes:
  pgdata:
  s3data:
  clamdb:
