# Environnement de DÉVELOPPEMENT uniquement : ports liés à 127.0.0.1, mots de passe surchargeables via infra/.env.
# Avant tout environnement partagé : épingler les images par digest (minio, mailpit) et fournir les secrets via un coffre.
name: ghmt
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ghmt_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghmt_dev_only}
      POSTGRES_DB: ghmt
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghmt_owner -d ghmt"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ghmt}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ghmt_dev_only}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  pgdata:
  miniodata:
