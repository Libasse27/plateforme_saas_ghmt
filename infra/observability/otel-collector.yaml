# OpenTelemetry Collector (docs/13 D11) : reçoit traces et journaux de l'API en OTLP (réseau interne `edge`), masque les
# attributs sensibles (second filet après RedactingSpanExporter de l'API), échantillonne en queue (100 % des erreurs,
# 10 % du reste) et exporte vers Tempo et Loki (profil `observability`) ou vers un service externe (réseau `egress`).
# Destinations : OTEL_TRACES_ENDPOINT (défaut http://tempo:4318), OTEL_LOGS_ENDPOINT (défaut http://loki:3100/otlp).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # En-têtes capturés, corps et query string : jamais conservés.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: url.query
        action: delete
      - pattern: ^http\.(request|response)\.header\..*
        action: delete
      - pattern: ^(.*\.)?body(\..*)?$
        action: delete

  # URL sans query string (termes de recherche, jetons).
  transform/redact-urls:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["url.full"], "\\?.*$", "")
          - replace_pattern(attributes["http.url"], "\\?.*$", "")
          - replace_pattern(attributes["http.target"], "\\?.*$", "")

  # Messages d'erreur : les erreurs pg ou Prisma citent des valeurs saisies (`invalid input syntax … "<valeur>"`).
  # Le statut en erreur ne garde qu'un libellé générique ; un événement `exception` ne garde que `exception.type`.
  # (Second filet après RedactingSpanExporter de l'API.)
  transform/redact-errors:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(status.message, "error") where status.code == STATUS_CODE_ERROR
      - context: spanevent
        statements:
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")

  # D11 : 100 % des traces en erreur, 10 % des autres.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      - name: erreurs
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: echantillon-10-pourcent
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

  batch: {}

exporters:
  otlphttp/traces:
    endpoint: ${env:OTEL_TRACES_ENDPOINT:-http://tempo:4318}
  otlphttp/logs:
    endpoint: ${env:OTEL_LOGS_ENDPOINT:-http://loki:3100/otlp}

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, transform/redact-urls, transform/redact-errors, tail_sampling, batch]
      exporters: [otlphttp/traces]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/logs]
