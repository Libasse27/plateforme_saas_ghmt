# Environnement de DÉVELOPPEMENT uniquement : ports liés à 127.0.0.1, mots de passe surchargeables via infra/.env.
# Images épinglées par digest (docs/11 §6.5) : le tag lisible est conservé pour la relecture, seul le digest fait foi.
# Mise à jour : `docker buildx imagetools inspect <image>:<tag>` puis remplacer le digest ; contrôle : infra/deploy/check-pinned-images.sh.
# Stockage objet : MinIO retiré (aucun code n'utilise S3) ; le remplaçant sera choisi au lot « fichiers » de la roadmap (docs/06).
# Avant tout environnement partagé : fournir les secrets via un coffre.
name: ghmt
services:
  postgres:
    # postgres:17.11-alpine
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ghmt_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghmt_dev_only}
      POSTGRES_DB: ghmt
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghmt_owner -d ghmt"]
      interval: 5s
      retries: 10
  redis:
    # redis:7.4.11-alpine
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports: ["127.0.0.1:6379:6379"]
  mailpit:
    # axllent/mailpit:v1.31.4
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  pgdata:
