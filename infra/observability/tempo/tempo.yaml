# Tempo monolithique du profil `observability` : traces reçues du Collector (OTLP). Rétention 7 jours, stockage local.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 168h

usage_report:
  reporting_enabled: false
