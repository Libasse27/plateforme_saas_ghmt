# Topologie de déploiement de RÉFÉRENCE (docs/11 §6.6, §14.3, D11) : Traefik est le seul service qui publie des ports.
# `web` et `api` n'ont aucun `ports:` et ne sont joignables que sur le réseau interne `edge`.
# Aucun PostgreSQL ici : la base est gérée.
# Secrets : fichiers de infra/deploy/secrets/ (générés par init-secrets.sh) montés en secrets Docker ; aucun secret en variable
# d'environnement du compose. entrypoint-secrets.sh exporte NOM depuis NOM_FILE juste avant de lancer le processus.
# Essai local : DOMAIN=ghmt.localhost, ACME_ENABLED vide (certificat auto-signé de Traefik), voir infra/deploy/README.md.
# docs/13 §6.2 : stockage objet EXTERNE (S3, secrets), `clamav` (réseau `data`, aucun port), Collector OpenTelemetry,
# tâches `backup`, `restore-test` et `prune` (profil `tools`, lancées par le cron de l'hôte), et profil `observability`
# (Prometheus, Alertmanager, Grafana, Loki, Tempo, exportateurs) sur le réseau interne `observability`. Grafana n'est
# pas publié (docs/13 §13 Q7) : accès par tunnel SSH vers son adresse fixe du réseau `admin` (README).
name: ghmt-prod

x-secrets-entrypoint: &secrets_entrypoint ["/bin/sh", "/entrypoint-secrets.sh"]
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
# Tâches ponctuelles de sauvegarde (infra/backup) : image construite depuis le dépôt, aucun port, sortie vers la base
# gérée et le stockage objet seulement (réseau `egress`). Secrets lus par fichier par les scripts (NOM_FILE).
x-backup-task: &backup_task
  build:
    context: ../backup
    additional_contexts:
      prisma: ../../apps/api/prisma
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: "no"
  profiles: [tools]
  environment: &backup_env
    # Profil `tools` seulement : vérifiées par les scripts (require_vars), pas à l'interpolation des autres services.
    BACKUP_BUCKET: ${BACKUP_BUCKET:-}
    BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
    BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
    BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-true}
    BACKUP_S3_ACCESS_KEY_ID_FILE: /run/secrets/backup_s3_access_key_id
    BACKUP_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_s3_secret_access_key
    BACKUP_WORK_DIR: /work
    BACKUP_METRICS_DIR: /metrics
  tmpfs: ["/tmp"]
  networks: [egress]

services:
  traefik:
    # traefik:v3.7.13
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    <<: *hardening
    entrypoint: ["/bin/sh", "/entrypoint-secrets.sh", "traefik"]
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Aucun amont devant Traefik : toute valeur reçue de X-Forwarded-* est écrasée (TRUSTED_PROXY_HOPS=1).
      # Derrière un CDN ou un répartiteur, déclarer ses plages ici ET passer TRUSTED_PROXY_HOPS à 2 (README).
      - --entrypoints.web.forwardedHeaders.trustedIPs=
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.invalid}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --api.dashboard=false
      - --accesslog=false
    # Écoute sur 80/443 : seule capacité conservée.
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Lues par le modèle Go de traefik/dynamic.yml.
      DOMAIN: ${DOMAIN:?DOMAIN est obligatoire}
      ACME_ENABLED: ${ACME_ENABLED:-}
      EDGE_PROXY_SECRET_FILE: /run/secrets/edge_proxy_secret
    secrets: [edge_proxy_secret]
    volumes:
      - ./entrypoint-secrets.sh:/entrypoint-secrets.sh:ro
      - ./traefik:/etc/traefik/dynamic:ro
      - traefik-acme:/acme
    tmpfs: ["/tmp"]
    networks: [edge, public]

  web:
    build: { context: ../.., dockerfile: apps/web/Dockerfile }
    <<: *hardening
    entrypoint: *secrets_entrypoint
    command: ["node_modules/.bin/next", "start", "-p", "3001"]
    environment:
      NODE_ENV: production
      API_URL: http://api:3000/api/v1
      SESSION_COOKIE_SECURE: "true"
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      EDGE_PROXY_SECRET_FILE: /run/secrets/edge_proxy_secret
      CSP_MODE: ${CSP_MODE:-enforce}
      CSP_REPORT_URI: ${CSP_REPORT_URI:-}
      CSP_FORM_ACTION_ORIGINS: ${CSP_FORM_ACTION_ORIGINS:-}
    secrets: [edge_proxy_secret]
    volumes:
      - ./entrypoint-secrets.sh:/entrypoint-secrets.sh:ro
    expose: ["3001"]
    tmpfs: ["/tmp", "/app/.next/cache"]
    networks: [edge]

  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    <<: *hardening
    entrypoint: *secrets_entrypoint
    # OpenTelemetry démarré AVANT Nest (docs/13 D11, src/instrumentation.ts).
    command: ["node", "--require", "./dist/instrumentation.js", "dist/main.js"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      JWT_ISSUER: ${JWT_ISSUER:?}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?}
      WEB_URL: https://${DOMAIN:?}
      CORS_ORIGINS: https://${DOMAIN:?}
      # Seul le BFF (réseau `edge`) est un proxy de confiance pour X-Forwarded-For : sous-réseau fixé ci-dessous.
      TRUSTED_PROXIES: 172.30.0.0/24
      RATE_LIMIT_STORE: redis
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:?}
      # Documents (docs/13 D2 à D5) : stockage objet EXTERNE (https), buckets distincts, antivirus interne.
      FILES_ENABLED: ${FILES_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT est obligatoire (https)}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:?}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:?}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      # Observabilité (D11) : traces et journaux vers le Collector ; métriques sur un port interne, jamais routé.
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: ghmt-api
      METRICS_PORT: "9464"
      # Métriques à l'écoute de la seule adresse de l'API sur `observability` (fixée ci-dessous) : web (`edge`), clamav
      # (`data`) et le reste n'y accèdent pas, même s'ils partagent un réseau avec l'API.
      METRICS_HOST: 172.29.0.10
      # Secrets : exportés par entrypoint-secrets.sh depuis /run/secrets/*.
      DATABASE_URL_FILE: /run/secrets/database_url
      PLATFORM_DATABASE_URL_FILE: /run/secrets/platform_database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      JWT_ACCESS_SECRET_FILE: /run/secrets/jwt_access_secret
      JWT_PLATFORM_SECRET_FILE: /run/secrets/jwt_platform_secret
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      BLIND_INDEX_KEY_FILE: /run/secrets/blind_index_key
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
    secrets:
      [database_url, platform_database_url, redis_url, jwt_access_secret, jwt_platform_secret, data_encryption_key, blind_index_key, s3_access_key_id, s3_secret_access_key]
    volumes:
      - ./entrypoint-secrets.sh:/entrypoint-secrets.sh:ro
    # 3000 : API (BFF et routeur Traefik limité) ; 9464 : métriques, joint par Prometheus seul (réseau `observability`).
    expose: ["3000", "9464"]
    depends_on: [redis, otel-collector]
    tmpfs: ["/tmp"]
    networks:
      edge: {}
      data: {}
      egress: {}
      observability:
        ipv4_address: 172.29.0.10

  redis:
    # redis:7.4.11-alpine
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    <<: *hardening
    # Mot de passe obligatoire (docs/11 §14.3.2) : lu dans le secret, jamais en argument visible de `docker inspect`.
    entrypoint: ["/bin/sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$(cat /run/secrets/redis_password)\""]
    user: redis
    secrets: [redis_password]
    tmpfs: ["/data"]
    networks: [data]

  clamav:
    # clamav/clamav:1.5.4 (clamd sur 3310, ~1,5 Go de mémoire). Aucun port : joint par l'API sur `data` ; `egress` sert
    # uniquement à freshclam (mise à jour des signatures). Racine inscriptible : l'image prépare ses répertoires au démarrage.
    image: clamav/clamav:1.5.4@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes:
      - clamav-db:/var/lib/clamav
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 300s
      retries: 3
    networks: [data, egress]

  otel-collector:
    # otel/opentelemetry-collector-contrib:0.162.0 (masquage, échantillonnage en queue : infra/observability/otel-collector.yaml)
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    <<: *hardening
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      # Destinations : Tempo et Loki du profil `observability` par défaut (même réseau). Un service externe exige d'ajouter
      # le réseau `egress` au Collector (surcharge de compose) ; ce n'est pas le cas par défaut (surface minimale).
      OTEL_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://tempo:4318}
      OTEL_LOGS_ENDPOINT: ${OTEL_LOGS_ENDPOINT:-http://loki:3100/otlp}
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    expose: ["4318"]
    mem_limit: 512m
    # Reçoit l'OTLP de l'API et exporte vers Tempo/Loki : `observability` seul (ni `edge` ni `egress`).
    networks: [observability]

  # --- Tâches de sauvegarde (profil `tools`, cron de l'hôte : runbook de README.md) ----------------------------------
  backup:
    <<: *backup_task
    command: ["backup.sh"]
    environment:
      <<: *backup_env
      BACKUP_DATABASE_URL_FILE: /run/secrets/backup_database_url
      BACKUP_AGE_RECIPIENT_FILE: /run/secrets/backup_age_recipient
      BACKUP_LOCK_MODE: ${BACKUP_LOCK_MODE:-COMPLIANCE}
    secrets: [backup_database_url, backup_age_recipient, backup_s3_access_key_id, backup_s3_secret_access_key]
    volumes:
      - backup-work:/work
      - backup-metrics:/metrics

  # Restauration de contrôle dans un PostgreSQL JETABLE, interne au conteneur. Exige la clé privée age : à lancer sur
  # l'hôte de vérification qui la détient (jamais l'hôte de production, docs/13 D9), avec ses propres secrets.
  restore-test:
    <<: *backup_task
    command: ["restore-test.sh"]
    environment:
      <<: *backup_env
      BACKUP_AGE_IDENTITY_FILE: /run/secrets/backup_age_identity
    secrets: [backup_age_identity, backup_s3_access_key_id, backup_s3_secret_access_key]
    volumes:
      - restore-work:/work
      - backup-metrics:/metrics

  # Rétention 35 quotidiennes / 12 mensuelles, si le fournisseur n'a pas de règle de cycle de vie.
  prune:
    <<: *backup_task
    command: ["prune.sh"]
    secrets: [backup_s3_access_key_id, backup_s3_secret_access_key]
    volumes:
      - backup-work:/work

  # --- Profil `observability` : réseau interne, aucun port publié --------------------------------------------------
  prometheus:
    # prom/prometheus:v3.15.0
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    <<: *hardening
    profiles: [observability]
    # La cible TLS (DOMAIN) est écrite au démarrage pour la découverte par fichier.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /tmp/targets &&
        printf '[{"targets":["%s:443"]}]' "$$DOMAIN" > /tmp/targets/tls.json &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=30d --web.listen-address=:9090
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    tmpfs: ["/tmp"]
    networks: [observability]

  alertmanager:
    # prom/alertmanager:v0.34.1 ; configuration rendue au démarrage depuis le modèle (mot de passe SMTP en secret).
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    <<: *hardening
    profiles: [observability]
    entrypoint:
      - /bin/sh
      - -c
      - >-
        sed -e "s|__ALERT_EMAIL__|$$ALERT_EMAIL|" -e "s|__SMTP_HOST__|$$ALERT_SMTP_HOST|" -e "s|__MAIL_FROM__|$$ALERT_MAIL_FROM|"
        -e "s|__SMTP_USER__|$$ALERT_SMTP_USER|" /etc/alertmanager/alertmanager.yml.tmpl > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      # Profil `observability` seulement : une valeur vide fait échouer le démarrage d'Alertmanager (visible), sans
      # bloquer l'interpolation des autres services.
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      ALERT_SMTP_HOST: ${SMTP_HOST:?}:${SMTP_PORT:-587}
      ALERT_MAIL_FROM: ${MAIL_FROM:?}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
    secrets: [alertmanager_smtp_password]
    volumes:
      - ../observability/alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - alertmanager-data:/alertmanager
    tmpfs: ["/tmp"]
    networks: [observability, egress]

  node-exporter:
    # prom/node-exporter:v1.12.1 : SEUL le collecteur textfile (métriques de backup.sh et restore-test.sh), aucun accès à l'hôte.
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    <<: *hardening
    profiles: [observability]
    command: ["--collector.disable-defaults", "--collector.textfile", "--collector.textfile.directory=/metrics"]
    volumes:
      - backup-metrics:/metrics:ro
    networks: [observability]

  blackbox-exporter:
    # prom/blackbox-exporter:v0.29.0 : antivirus (via /health/ready, réseau interne) et certificat public (`egress`).
    image: prom/blackbox-exporter:v0.29.0@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea
    <<: *hardening
    profiles: [observability]
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ../observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [observability, egress]

  loki:
    # grafana/loki:3.7.0 (journaux reçus en OTLP du Collector, rétention 30 jours)
    image: grafana/loki:3.7.0@sha256:c316b7c7589a5eeca843b6926c7446149d18300b79ac8538dc4ae063bc478da2
    <<: *hardening
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    tmpfs: ["/tmp"]
    networks: [observability]

  tempo:
    # grafana/tempo:2.10.0 (traces reçues du Collector, rétention 7 jours)
    image: grafana/tempo:2.10.0@sha256:d7f4c72e0bad2b42b4e7263b0addaf3f5bbc105cec6b1917eba0aae3b9b70364
    <<: *hardening
    profiles: [observability]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    tmpfs: ["/tmp"]
    networks: [observability]

  grafana:
    # grafana/grafana:13.2.3 : AUCUN port publié (docs/13 §13 Q7). Accès : tunnel SSH vers 172.31.0.10:3000 (README).
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    <<: *hardening
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    secrets: [grafana_admin_password]
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    tmpfs: ["/tmp"]
    networks:
      observability: {}
      admin:
        ipv4_address: 172.31.0.10

secrets:
  edge_proxy_secret: { file: ./secrets/edge_proxy_secret }
  database_url: { file: ./secrets/database_url }
  platform_database_url: { file: ./secrets/platform_database_url }
  redis_url: { file: ./secrets/redis_url }
  redis_password: { file: ./secrets/redis_password }
  jwt_access_secret: { file: ./secrets/jwt_access_secret }
  jwt_platform_secret: { file: ./secrets/jwt_platform_secret }
  data_encryption_key: { file: ./secrets/data_encryption_key }
  blind_index_key: { file: ./secrets/blind_index_key }
  # Stockage objet de l'application (documents, docs/13 D2).
  s3_access_key_id: { file: ./secrets/s3_access_key_id }
  s3_secret_access_key: { file: ./secrets/s3_secret_access_key }
  # Sauvegardes (D9) : rôle ghmt_backup, identifiants S3 DISTINCTS de ceux de l'application, clé publique age.
  backup_database_url: { file: ./secrets/backup_database_url }
  backup_s3_access_key_id: { file: ./secrets/backup_s3_access_key_id }
  backup_s3_secret_access_key: { file: ./secrets/backup_s3_secret_access_key }
  backup_age_recipient: { file: ./secrets/backup_age_recipient }
  # Clé PRIVÉE age : présente uniquement sur l'hôte de vérification qui lance restore-test (jamais en production).
  backup_age_identity: { file: ./secrets/backup_age_identity }
  alertmanager_smtp_password: { file: ./secrets/alertmanager_smtp_password }
  grafana_admin_password: { file: ./secrets/grafana_admin_password }

networks:
  # Réseau de Traefik (seul service à publier des ports).
  public: {}
  # Sortie vers la base gérée et le SMTP, sans aucun port publié.
  egress: {}
  # Réseau interne : aucun accès depuis l'extérieur de l'hôte Docker.
  edge:
    internal: true
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
  data:
    internal: true
  # Observabilité : Prometheus, Loki, Tempo, Grafana, exportateurs, Collector, et l'API (OTLP vers le Collector, métriques
  # sur 172.29.0.10). Ni web, ni traefik, ni clamav, ni les tâches de sauvegarde n'y sont rattachés.
  observability:
    internal: true
    ipam:
      config: [{ subnet: 172.29.0.0/24 }]
  # Accès d'administration à Grafana par tunnel SSH (adresse fixe, aucun port publié).
  admin:
    ipam:
      config: [{ subnet: 172.31.0.0/24 }]

volumes:
  traefik-acme:
  clamav-db:
  backup-work:
  # Dump déchiffré et base restaurée EN CLAIR : disque chiffré de l'hôte de vérification, ou tmpfs dimensionné (README).
  # Purgé au démarrage de restore-test.sh. Ne monter dans ce conteneur aucun autre secret que ceux listés ci-dessus.
  restore-work:
  backup-metrics:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  grafana-data:
