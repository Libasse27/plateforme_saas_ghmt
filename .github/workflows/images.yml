# Images de production (docs/13 §11.1 point 4, §13 Q8) : API, migration et web construites à chaque PR (sans publication) ;
# sur `main`, publiées sur GHCR avec SBOM et provenance (attestations BuildKit), signées par cosign sans clé (OIDC de
# GitHub, journal de transparence Rekor), puis signature vérifiée. Contexte de construction : la racine du dépôt.
# Vérification par un tiers :
#   cosign verify ghcr.io/<propriétaire>/ghmt-api@sha256:<digest> \
#     --certificate-identity-regexp '^https://github.com/<propriétaire>/<dépôt>/.github/workflows/images.yml@refs/heads/main$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  construire:
    name: Construire ${{ matrix.image.nom }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - { nom: ghmt-api, dockerfile: apps/api/Dockerfile, cible: runtime }
          - { nom: ghmt-api-migrate, dockerfile: apps/api/Dockerfile, cible: migrate }
          - { nom: ghmt-web, dockerfile: apps/web/Dockerfile, cible: runtime }
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construire (sans publication)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.cible }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image.nom }}

  publier:
    name: Publier ${{ matrix.image.nom }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # publication sur GHCR
      id-token: write # jeton OIDC de la signature cosign sans clé
    strategy:
      fail-fast: false
      matrix:
        image:
          - { nom: ghmt-api, dockerfile: apps/api/Dockerfile, cible: runtime }
          - { nom: ghmt-api-migrate, dockerfile: apps/api/Dockerfile, cible: migrate }
          - { nom: ghmt-web, dockerfile: apps/web/Dockerfile, cible: runtime }
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GHCR exige un nom en minuscules (le propriétaire du dépôt peut en contenir).
      - name: Nom de l'image
        id: nom
        env:
          PROPRIETAIRE: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image.nom }}
        run: echo "image=ghcr.io/${PROPRIETAIRE,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Étiquettes (SHA du commit, latest)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.nom.outputs.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Connexion à GHCR (GITHUB_TOKEN)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier (SBOM et provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.cible }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image.nom }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.nom }}

      # Aucune signature d'une image vulnérable : le digest publié est analysé (couches système et node_modules) avant
      # cosign. Identifiants GHCR lus depuis la configuration Docker de l'étape de connexion, en lecture seule.
      - name: Trivy image (aquasec/trivy:0.75.0)
        env:
          IMAGE: ${{ steps.nom.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          docker run --rm -v "$HOME/.docker/config.json:/root/.docker/config.json:ro"
          -v "$GITHUB_WORKSPACE/scripts/ci/trivy-ignore.yaml:/trivy-ignore.yaml:ro"
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /trivy-ignore.yaml
          --timeout 15m --exit-code 1 --no-progress "${IMAGE}@${DIGEST}"

      - name: Installer cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signature du digest (jamais d'une étiquette mobile), identité = ce workflow sur main.
      - name: Signer l'image (cosign sans clé)
        env:
          IMAGE: ${{ steps.nom.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Vérifier la signature
        env:
          IMAGE: ${{ steps.nom.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITE: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: >-
          cosign verify "${IMAGE}@${DIGEST}"
          --certificate-identity "${IDENTITE}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          > /dev/null
